<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Warehouse Assistant Demo</title>
<style>
  /* 關閉按鈕 */
  #close-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(0,0,0,.35); color: #fff; border: none;
    font-size: 16px; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .2s; vertical-align: middle; margin-left: 4px;
  }
  #close-btn:hover { background: #e53e3e; }

  /* 重置展示資料按鈕：低調、不搶眼，避免被觀眾誤點 */
  #reset-demo-btn {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(0,0,0,.15); color: rgba(255,255,255,.6); border: none;
    font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .2s; vertical-align: middle; margin-left: 4px;
  }
  #reset-demo-btn:hover { background: rgba(0,0,0,.3); color: #fff; }

  :root {
    --bg:        #f5f7fa;
    --card:      #ffffff;
    --primary:   #2c5282;   /* deep blue */
    --primary-2: #4299e1;   /* mid blue */
    --accent:    #ed8936;   /* outbound orange */
    --success:   #38a169;   /* inbound green */
    --warning:   #e53e3e;   /* low-stock red */
    --gold:      #d69e2e;   /* TOP 3 gold */
    --muted:     #718096;
    --border:    #e2e8f0;
    --text:      #1a202c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    background: var(--primary);
    color: white;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.1);
  }
  header .icon { font-size: 22px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header .sub { font-size: 12px; opacity: .8; margin-left: auto; }

  #chips-bar {
    background: white;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .chip {
    flex-shrink: 0;
    background: white;
    color: var(--primary);
    border: 1px solid var(--primary-2);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .chip:active { transform: scale(.95); }
  .chip.primary { background: var(--primary); color: white; }
  .chip.warning { background: var(--warning); color: white; border-color: var(--warning); }
  .chip.gold    { background: var(--gold);    color: white; border-color: var(--gold); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    margin-bottom: 14px;
    max-width: 88%;
  }
  .msg.user {
    margin-left: auto;
    background: var(--primary-2);
    color: white;
    padding: 10px 14px;
    border-radius: 18px 18px 4px 18px;
  }
  .msg.bot {
    background: white;
    padding: 12px 14px;
    border-radius: 18px 18px 18px 4px;
    border: 1px solid var(--border);
    white-space: pre-wrap;
    line-height: 1.6;
  }
  .msg.bot.guide { background: #ebf8ff; border-color: var(--primary-2); }
  .msg.bot.rejected { background: #fff5f5; border-color: var(--warning); color: #742a2a; }

  /* view card */
  .view-card {
    margin-top: 8px;
    padding: 14px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .view-card .kpi {
    font-size: 32px;
    font-weight: 700;
    color: var(--primary);
    margin: 6px 0;
  }
  .view-card .kpi.warning { color: var(--warning); }
  .view-card .kpi.success { color: var(--success); }
  .view-card .label { font-size: 12px; color: var(--muted); }
  .view-card .label.agent-label { font-size: 13px; font-weight: 600; color: var(--text); }
  .view-card .sub-label { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* 三橫條 */
  .wh-bars { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .wh-bar { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .wh-bar .wh-name { width: 60px; color: var(--muted); }
  .wh-bar .bar-track {
    flex: 1; height: 18px; background: #edf2f7; border-radius: 9px; overflow: hidden;
  }
  .wh-bar .bar-fill {
    height: 100%; background: var(--primary-2);
    border-radius: 9px; transition: width .4s;
  }
  .wh-bar .wh-qty { width: 60px; text-align: right; font-weight: 600; }

  /* 警示表格 */
  .alert-table {
    width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px;
  }
  .alert-table th { background: #fff5f5; color: var(--warning); padding: 8px; text-align: left; font-weight: 600; }
  .alert-table td { padding: 8px; border-top: 1px solid var(--border); }
  .alert-table tr.critical td { background: #fff5f5; }
  .shortage-bar {
    height: 8px; background: #edf2f7; border-radius: 4px; overflow: hidden; margin-top: 3px;
  }
  .shortage-bar .fill { height: 100%; background: var(--warning); }

  /* 排行榜 */
  .rank-list { margin-top: 8px; }
  .rank-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px;
  }
  .rank-row:first-child { border-top: none; }
  .rank-row .num {
    width: 30px; height: 30px; border-radius: 50%;
    background: #edf2f7; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
  }
  .rank-row .num.top1 { background: var(--gold); color: white; }
  .rank-row .num.top2 { background: #c4b59a; color: white; }
  .rank-row .num.top3 { background: #b08861; color: white; }
  .rank-row .name { flex: 1; font-weight: 500; }
  .rank-row .qty {
    background: var(--primary-2); color: white;
    padding: 3px 8px; border-radius: 10px; font-size: 12px; font-weight: 600;
  }

  /* 進出條形圖 */
  .mov-bars { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
  .mov-row { display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .mov-row .date { width: 70px; color: var(--muted); }
  .mov-row .bars { flex: 1; display: flex; gap: 2px; height: 16px; }
  .mov-row .in-bar  { background: var(--success); border-radius: 2px; }
  .mov-row .out-bar { background: var(--accent);  border-radius: 2px; }
  .mov-legend { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; gap: 12px; }
  .mov-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }

  /* 對比 */
  .cmp-pair { display: flex; gap: 10px; margin-top: 8px; }
  .cmp-col {
    flex: 1; background: #f7fafc; padding: 10px; border-radius: 8px; text-align: center;
  }
  .cmp-col.winner { background: #ebf8ff; border: 2px solid var(--primary-2); }
  .cmp-col .lbl { font-size: 12px; color: var(--muted); }
  .cmp-col .val { font-size: 20px; font-weight: 700; color: var(--primary); margin-top: 4px; }

  #input-bar {
    background: white;
    border-top: 1px solid var(--border);
    padding: 10px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  #input-text {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 14px;
    font-size: 15px;
    outline: none;
    font-family: inherit;
    resize: none;
    min-height: 40px;
    max-height: 80px;
  }
  #input-text:focus { border-color: var(--primary-2); }
  #send-btn {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 18px;
    cursor: pointer;
    transition: all .15s;
  }
  #send-btn:disabled { opacity: .5; cursor: not-allowed; }
  #send-btn.sending {
    opacity: 1;
    background: var(--muted);
    animation: send-spin 1s linear infinite;
  }
  @keyframes send-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .send-status {
    display: none;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: 2px 0 0;
  }
  .send-status.show { display: block; }

  /* 麥克風 (Web Speech API) */
  .mic-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border); background: white;
    cursor: pointer; padding: 0; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, border-color .2s;
  }
  .mic-btn svg { width: 22px; height: 22px; fill: var(--muted); }
  .mic-btn:hover { background: var(--bg); }
  .mic-btn.recording {
    background: var(--warning); border-color: var(--warning);
    animation: mic-pulse 1.2s ease-in-out infinite;
  }
  .mic-btn.recording svg { fill: white; }
  .mic-btn:disabled { opacity: .4; cursor: not-allowed; }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(229,62,62,.5); }
    50%      { box-shadow: 0 0 0 8px rgba(229,62,62,0); }
  }
  .mic-status {
    font-size: 12px; color: var(--muted);
    text-align: center; margin: 4px 0; min-height: 16px;
  }

  .suggestions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .sug {
    background: white;
    border: 1px solid var(--primary-2);
    color: var(--primary);
    padding: 5px 12px;
    border-radius: 14px;
    font-size: 12px;
    cursor: pointer;
  }
  .sug:active { transform: scale(.95); }

  /* 連帶備貨 related view */
  .rel-anchor {
    font-size: 13px; color: var(--muted); margin-bottom: 4px;
  }
  .rel-anchor b { color: var(--text); font-size: 15px; }
  .rel-item {
    padding: 10px 0; border-top: 1px solid var(--border);
  }
  .rel-item:first-child { border-top: none; }
  .rel-item .rel-top {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .rel-item .rel-name { font-weight: 600; font-size: 14px; word-break: break-word; }
  .rel-item .rel-cat { font-size: 11px; color: var(--muted); }
  .conf-badge {
    font-size: 12px; font-weight: 700; padding: 2px 8px;
    border-radius: 10px; cursor: pointer; white-space: nowrap;
    border: 1px dashed transparent;
  }
  .conf-badge:active { transform: scale(.94); }
  .conf-badge.gold { background: #fffaf0; color: #b7791f; border-color: #d69e2e; }
  .conf-badge.high { background: #fffaf0; color: #c05621; border-color: #ed8936; }
  .conf-badge.good { background: #f0fff4; color: #276749; border-color: #38a169; }
  .conf-badge.mid  { background: #ebf8ff; color: #2c5282; border-color: #4299e1; }
  .conf-badge.low  { background: #f7fafc; color: #718096; border-color: #cbd5e0; }
  .conf-badge .tap-hint { font-size: 9px; opacity: .6; margin-left: 2px; }
  .rel-quip {
    font-size: 13px; color: #5a6677; margin-top: 4px;
    font-style: italic; padding-left: 2px;
  }
  .rel-quip::before { content: "「"; }
  .rel-quip::after  { content: "」"; }
  .rel-stock {
    font-size: 11px; color: var(--muted); margin-top: 4px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .rel-stock .restock { color: var(--warning); font-weight: 600; }
  .days-badge {
    cursor: pointer; color: var(--primary); font-weight: 600;
    border: 1px dashed var(--primary-2); border-radius: 8px; padding: 1px 6px;
    white-space: nowrap;
  }
  .days-badge:active { transform: scale(.94); }
  .rel-trend-up   { color: var(--warning); }
  .rel-trend-down { color: var(--success); }
  .rel-restock-banner {
    margin-top: 10px; padding: 10px; background: #fff5f5;
    border: 1px solid var(--warning); border-radius: 8px;
    font-size: 13px; color: #742a2a; line-height: 1.5;
  }
  .rel-baseline-note {
    margin-top: 8px; font-size: 11px; color: var(--muted); text-align: center;
  }
  /* 點同捆率彈出的算式卡片 */
  #calc-pop {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: center; justify-content: center; z-index: 999;
    padding: 24px;
  }
  #calc-pop.show { display: flex; }
  .calc-box {
    background: white; border-radius: 16px; padding: 20px;
    max-width: 340px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,.25);
  }
  .calc-box h3 { margin: 0 0 12px; font-size: 16px; color: var(--primary); }
  .calc-formula {
    background: #f7fafc; border-radius: 10px; padding: 14px;
    text-align: center; font-size: 15px; line-height: 1.8; margin: 10px 0;
  }
  .calc-formula .big { font-size: 26px; font-weight: 700; color: var(--primary); }
  .calc-compare {
    font-size: 13px; color: #5a6677; line-height: 1.7; margin-top: 10px;
  }
  .calc-compare .hi { color: var(--warning); font-weight: 700; }
  .calc-close {
    margin-top: 16px; width: 100%; padding: 10px; border: none;
    background: var(--primary); color: white; border-radius: 10px;
    font-size: 14px; cursor: pointer;
  }

  /* 鉤子入口 chip(獵奇/八卦/驚喜) */
  .chip.hook {
    background: linear-gradient(135deg, #ed8936, #dd6b20);
    color: white; border-color: #dd6b20;
  }
  .chip.hook.purple { background: linear-gradient(135deg, #805ad5, #6b46c1); border-color: #6b46c1; }

  /* ⏰ 到期警示 view + 燈號徽章 */
  .exp-counts {
    display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap;
  }
  .exp-counts .cnt {
    font-size: 12px; padding: 4px 10px; border-radius: 12px; font-weight: 600;
  }
  .exp-counts .cnt.red    { background: #fff5f5; color: var(--warning); border: 1px solid var(--warning); }
  .exp-counts .cnt.orange { background: #fffaf0; color: #c05621; border: 1px solid #ed8936; }
  .exp-counts .cnt.yellow { background: #fffff0; color: #b7791f; border: 1px solid #d69e2e; }
  .exp-counts .cnt.green  { background: #f0fff4; color: var(--success); border: 1px solid var(--success); }
  .exp-table {
    width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px;
  }
  .exp-table th {
    background: #f7fafc; color: var(--muted); padding: 8px; text-align: left;
    font-weight: 600; font-size: 12px;
  }
  .exp-table td { padding: 8px; border-top: 1px solid var(--border); }
  .exp-table tr.lvl-red    td { background: #fff5f5; }
  .exp-table tr.lvl-orange td { background: #fffaf0; }
  .exp-table tr.lvl-yellow td { background: #fffff0; }
  .exp-table .days {
    display: inline-block; font-weight: 700; padding: 2px 8px; border-radius: 10px;
    font-size: 12px; white-space: nowrap;
  }
  .exp-table .days.red    { background: var(--warning); color: white; }
  .exp-table .days.orange { background: #ed8936; color: white; }
  .exp-table .days.yellow { background: #d69e2e; color: white; }
  /* 到期徽章(放在 inventory_single / related item 上)*/
  .exp-badge {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 10px; white-space: nowrap;
  }
  .exp-badge.red    { background: #fff5f5; color: var(--warning); border: 1px dashed var(--warning); }
  .exp-badge.orange { background: #fffaf0; color: #c05621;        border: 1px dashed #ed8936; }
  .exp-badge.yellow { background: #fffff0; color: #b7791f;        border: 1px dashed #d69e2e; }
  /* r9：撐天徽章(單品卡)——沿用 exp-badge 的尺寸，配色區分「還能撐多久」*/
  .cover-badge {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 10px; white-space: nowrap;
    background: #f7fafc; color: var(--muted); border: 1px dashed #cbd5e0;
  }
  .cover-badge.warn     { background: #fffaf0; color: #c05621; border-color: #ed8936; }
  .cover-badge.critical { background: #fff5f5; color: var(--warning); border-color: var(--warning); }

  /* loading dot */
  .loading-dots { display: inline-flex; gap: 3px; }
  .loading-dots span {
    width: 6px; height: 6px; background: var(--muted); border-radius: 50%;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: .15s; }
  .loading-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(.5); opacity: .3; }
    40% { transform: scale(1); opacity: 1; }
  }
  /* ── v2 Agent trace（多步浮現）── */
  .agent-trace { display: flex; flex-direction: column; gap: 6px; margin: 6px 0; }
  .trace-step {
    display: flex; align-items: flex-start; gap: 8px; padding: 7px 10px;
    background: rgba(120,160,255,.08); border-left: 3px solid var(--accent);
    border-radius: 6px; font-size: 13px; opacity: 0;
    animation: traceIn .35s ease forwards;
  }
  @keyframes traceIn { from { opacity:0; transform: translateX(-8px);} to {opacity:1; transform:none;} }
  .ts-icon { font-size: 15px; }
  .ts-kind { font-weight: 700; color: var(--accent); white-space: nowrap; min-width: 72px; }
  .ts-detail { color: var(--fg); line-height: 1.6; }
  .ts-warn { color: var(--danger) !important; font-weight: 600; }
  .ts-sub { margin: 4px 0 2px 28px; display: flex; flex-direction: column; gap: 2px; }
  .ts-sub-line { font-size: 12px; color: var(--muted); font-family: monospace; line-height: 1.5; }
  .ts-sub-line.ts-warn { color: var(--danger) !important; font-weight: 600; }
  .trace-step.trace-in { opacity: 0; animation: traceIn .35s ease forwards; }
  .agent-trace { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
  .rca-result { animation: traceIn .4s ease forwards; }
  .rca-summary {
    margin-top: 12px; padding: 10px 12px;
    background: var(--surface2, #f5f5f5); border-left: 3px solid var(--accent);
    border-radius: 6px; font-size: 13px; line-height: 1.7;
    animation: traceIn .4s ease forwards;
  }
  .tool-call-inline {
    font-size: 11px; color: var(--muted); margin: 2px 0; opacity: 0.8;
  }
  .tool-call-inline code {
    background: var(--surface2, #f0f0f0); padding: 1px 5px;
    border-radius: 4px; font-family: monospace; font-size: 11px;
  }
  .tool-calls-bar {
    font-size: 11px; color: var(--muted); padding: 3px 0 4px;
    border-bottom: 1px solid var(--border, #eee); margin-bottom: 6px;
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .rca-suggest {
    margin-top: 8px; padding: 10px 12px;
    background: var(--surface2, #f5f5f5); border-left: 3px solid var(--warning, #e67e22);
    border-radius: 6px; font-size: 13px; line-height: 1.7;
    animation: traceIn .4s ease forwards;
  }
  /* ── HITL Confirm框 ── */
  .clarify-opts { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 8px; }
  /* 選項做成大按鈕：min-height 48px 是手機/平板可靠的觸控目標下限，
     full-row tap target + clear border + press feedback for small expo screens */
  .clarify-row {
    display: flex; align-items: center; gap: 10px;
    width: 100%; min-height: 48px; padding: 10px 14px;
    background: var(--card, #fff); border: 1.5px solid var(--accent);
    border-radius: 10px; cursor: pointer; text-align: left;
    font: inherit; -webkit-tap-highlight-color: transparent;
  }
  .clarify-row:hover { background: rgba(237,137,54,.10); }
  .clarify-row:active { background: var(--accent); }
  .clarify-row:active .clarify-text { color: #fff; }
  .clarify-num {
    min-width: 24px; height: 24px; line-height: 24px; text-align: center;
    background: var(--accent); color: #fff; border-radius: 50%;
    font-size: 13px; font-weight: 700; flex-shrink: 0;
  }
  .clarify-text { font-size: 15px; color: var(--fg); }
  .clarify-sub { font-size: 11px; color: var(--muted); margin-left: 8px; }
  .clarify-cancel { opacity: .7; }
  .clarify-cancel .clarify-num { background: var(--muted); }
  .clarify-cancel .clarify-text { color: var(--muted); }
  .clarify-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* ── Human-in-the-loop 授權卡片 ── */
  .hitl-card { border-radius: 10px; overflow: hidden; margin: 6px 0;

  .hitl-before{ color: #e53e3e; font-weight: 700; font-size: 16px; text-decoration: line-through; opacity: .8; }
  .hitl-arrow { font-size: 18px; color: var(--muted); }
  .hitl-after { color: #38a169; font-weight: 700; font-size: 16px; }

  /* ── A 波報告預覽 ── */
  .report-preview { background: rgba(0,0,0,.04); border-radius: 6px; padding: 10px;
    font-size: 11px; line-height: 1.5; max-height: 260px; overflow: auto;
    white-space: pre-wrap; margin: 6px 0; font-family: 'Microsoft JhengHei', monospace; }
  /* ── 主動異常偵測橫幅 ── */
  /* ⚠️ overflow 原本是 hidden（為了圓角），但它**把子層 .ab-list 的縱向捲動吃掉**
     → 展開後只看得到前幾筆、捲不動。改成只裁切橫向，縱向交給子層自己捲。 */
  .anomaly-bar { background: linear-gradient(135deg,#7a2020,#a13030); color:#fff;

  .ab-list { display:none; padding:0 14px 12px; max-height:38vh; overflow-y:auto; }

  .ab-dot { width:8px; height:8px; border-radius:50%; margin-top:5px; flex-shrink:0; }

  .capmap { margin:10px 0; display:flex; flex-direction:column; gap:8px; }

/* 已檢查但未達條件 — 刻意用「安心綠」而非警報紅：訪客要能一眼分辨
   「規則跑了、目前沒事」與「真的有東西缺貨」 */
/* 動態倉庫模擬：開啟時按鈕變綠，訪客一眼知道現在資料在動 */
/* 即時看板列 —— 數字變動時閃一下，訪客一眼看到「資料在動」 */
#live-bar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 7px 12px; background: rgba(72,187,120,.07);
  border-top: 1px solid rgba(72,187,120,.25);
  border-bottom: 1px solid rgba(72,187,120,.25);
  font-size: 12px;
}
#live-bar .lb-item { display: flex; align-items: baseline; gap: 5px; }
#live-bar .lb-label { color: var(--muted); font-size: 11px; }
#live-bar .lb-val {
  font-weight: 700; font-size: 14px; color: var(--text);
  transition: color .25s, transform .25s; display: inline-block;
}
#live-bar .lb-val.warn { color: #fbb6ce; }
#live-bar .lb-val.up   { color: #68d391; transform: scale(1.22); }
#live-bar .lb-val.down { color: #fc8181; transform: scale(1.22); }
#live-bar .lb-sep { width: 1px; height: 18px; background: rgba(255,255,255,.15); }
#live-bar .lb-pulse {
  margin-left: auto; color: #68d391; font-size: 11px; letter-spacing: .5px;
  animation: lbBlink 1.6s ease-in-out infinite;
}
@keyframes lbBlink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
#live-bar .lb-ctl {
  display: flex; align-items: center; gap: 5px;
  color: var(--muted); font-size: 11px; cursor: pointer;
}
#live-bar .lb-ctl input[type=range] { width: 90px; cursor: pointer; }
#live-bar .lb-toggle {
  font-size: 11px; padding: 3px 8px; cursor: pointer;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.18);
  border-radius: 5px; color: var(--text);
}
/* 60 商品清單 —— 一列一商品，北/中/南三倉各自的量獨立跳動 */
#live-grid {
  padding: 0; max-height: 46vh; overflow-y: auto;
  background: rgba(0,0,0,.16); border-bottom: 1px solid rgba(72,187,120,.2);
}
.lg-head, .lg-row {

  gap: 4px; align-items: baseline; padding: 4px 12px;
}
.lg-head {

  background: #1a2130; color: var(--muted); font-size: 10.5px;

}

/* 2026-08-06 user 回報「最右邊 TOTAL 顏色太淺了不清楚」：原 #90cdf4 是
   為深底挑的淺藍，實際渲染在白底表格上 → 幾乎看不見。
   改深藍 #1c4f8f（白底對比 ~7:1 過 WCAG AA），字重升 800 讓合計欄

/* ── 手機瀏覽器動態工具列修正（2026-08-05 熱點手機實測）──
   iPhone 的 100vh 含被底部工具列遮住的區域 → 輸入列整排看不見
   （「下面沒打字和語音那排」）。dvh=動態視口高度（iOS 15.4+），
   桌面 kiosk 無動態工具列 dvh==vh，完全不受影響。 */
body { height: 100dvh; }
.alert-panel { height: 100dvh; }
@media (max-width: 768px) {
  /* 標題長（尤其英文版）時 wrap 會把 ✕ 擠到第二行 → 單行＋標題省略號 */

              overflow: hidden; text-overflow: ellipsis; }

/* ── 精簡頂部（14吋外接螢幕 150% 放大用）──
   shrink header / menu / anomaly bar to give vertical space to the chat area.
   enabled via <body class="compact-top">; remove the class to restore the full-height version. */
/* ⚠️ 這段必須放在**所有**基礎樣式之後——同權重下 CSS 後者勝，
   放前面會被 #chips-bar .chip 之類的規則覆蓋（踩過，改了沒效果）。
   ⚠️ kiosk 是 --force-device-scale-factor=1.5，**這裡的每個 px 到畫面上
   都乘 1.5**。訂數值時要用「螢幕實際高度 ÷ 1.5」回推。 */
body.compact-top header { padding: 2px 12px; gap: 7px;
                          box-shadow: 0 1px 3px rgba(0,0,0,.1); }
body.compact-top header .icon { font-size: 13px; }
body.compact-top header h1 { font-size: 12px; }
body.compact-top header .sub { font-size: 10px; }
/* 標題列右側按鈕（鈴鐺/重置/關閉）——**它們才是撐高標題列的元凶**。
   實測（CDP 量的，不是目測）：header 總高 40px、padding 只有 2+2、
   文字元素都 ≤15px，但 #close-btn 36px、#reset-demo-btn 28px、
   #alert-panel-btn 26px ⇒ 高度全被按鈕撐住。
   ⚠️ 必須用 **id 選擇器**覆蓋——那三顆各自用 id 寫死 width/height，
   id 權重高於 class，`body.compact-top header button` 蓋不掉。 */
body.compact-top #close-btn { width: 20px; height: 20px; font-size: 11px;
                              margin-left: 3px; }
body.compact-top #reset-demo-btn { width: 18px; height: 18px; font-size: 10px;
                                   margin-left: 3px; }
body.compact-top #alert-panel-btn { padding: 1px 6px; font-size: 11px;
                                    border-radius: 6px; }
body.compact-top header button { line-height: 1.1; min-height: 0; }
body.compact-top #chips-bar { padding: 2px 8px; gap: 4px; }
body.compact-top #chips-bar .chip { padding: 2px 7px; font-size: 10px;
                                    line-height: 1.25; }
/* 異常警示條：三條裡對訪客價值最低（只是展示「系統有在偵測」）
   → 壓成一條細帶；展開後的清單不受影響 */
body.compact-top .anomaly-bar { margin: 2px 8px; }
body.compact-top .ab-head { padding: 2px 8px; font-size: 11px; gap: 6px; }
body.compact-top .ab-b { font-size: 9px; padding: 0 5px; line-height: 1.4; }
/* 對話區起始留白也一起收，否則上面省下的空間被 margin 吃掉
   （⚠️ 容器 id 是 #messages 不是 #chat——寫錯選擇器等於整條沒作用） */
body.compact-top #messages { padding-top: 4px; }

// 統一管理送出Central狀態：按鈕轉圈 + 文字提示，避免使用者以為卡住而重複操作
function setSending(sending) {
  isSending = sending;
  const btn = $('send-btn');
  btn.disabled = sending;
  btn.classList.toggle('sending', sending);
  btn.textContent = sending ? '⟳' : '▶';
  // 底部處理中文字讓位給右下角效能徽章：只保留送出鈕轉圈，狀態改在對話氣泡呈現
  // r23 看門狗（create100 en r4b 實抓）：done frame 迷路或 handler 例外時
  // setSending(false) 沒跑到 → 送出鈕**永久鎖死**、訪客只能重整頁面。
  // 90 秒沒解鎖就強制恢復（正常回覆再慢也遠低於 90s）。
  if (window._sendWatchdog) { clearTimeout(window._sendWatchdog); window._sendWatchdog = null; }
  if (sending) {
    window._sendWatchdog = setTimeout(() => { if (isSending) setSending(false); }, 90000);
  }
}

function connectWS() {
  if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
  // 舊 socket 先解除事件 handler 再關：ws.close() 的 onclose 是非同步觸發的，
  // 若不解除，遲到的 onclose 會在新連線建好後才排一個 3 秒 reconnect，
  // 3 秒後 connectWS 又把健康的新連線關掉 → 無限「每 3 秒殺一次連線」循環，
  // 訊息送出後推論還沒跑完連線就被殺，回覆永遠到不了（2026-07-02 實測抓到）。
  if (ws) { const old = ws; old.onclose = null; old.onerror = null; old.onmessage = null; try { old.close(); } catch {} }
  const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const sock = new WebSocket(`${wsProto}//${location.host}/ws`);
  ws = sock;
  sock.onopen = () => { console.log('[ws] open'); setSending(false); };
  // 守衛：只有「自己還是當前連線」才排重連，被汰換掉的舊 socket 不排
  sock.onclose = () => { console.log('[ws] close'); if (ws === sock) scheduleReconnect(); };
  sock.onerror = e => { console.log('[ws] error', e); try { sock.close(); } catch {} };
  sock.onmessage = ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    handleMessage(msg);
  };
}
function scheduleReconnect() {
  if (wsReconnectTimer) return;
  if (document.hidden) return;
  wsReconnectTimer = setTimeout(() => { wsReconnectTimer = null; connectWS(); }, 3000);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    // 切回分頁時若連線還健康就不動它（connectWS 會殺掉重建，白白斷一次）
    if (ws && ws.readyState === WebSocket.OPEN) return;
    setTimeout(connectWS, 100);
  }
});

function renderAnomalyBanner(data) {
  const all = data.alerts || [];
  const counts = data.counts || {};
  let bar = document.getElementById('anomalyBar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'anomalyBar';
    bar.className = 'anomaly-bar';

    const host = document.getElementById('messages');
    if (host && host.parentNode) {
      host.parentNode.insertBefore(bar, host);
    } else {
      return;   // no mount point -> render nothing; never break the page
    }
  }
  const crit = counts.critical || 0, warn = counts.warning || 0, info = counts.info || 0;
  if (crit + warn + info === 0) { bar.style.display = 'none'; return; }
  // 全部列出（原本寫死 slice(0,5)，其餘只顯示「… and N more」看不到）
  // 清單本身可捲動（CSS max-height + overflow-y），一筆一行。
  const top = all.filter(a => a.level !== 'info');
  bar.style.display = 'block';
  bar.innerHTML = `
    <div class="ab-head" onclick="this.parentNode.classList.toggle('open')">
      <b>⚠ Detected ${crit + warn} issues needing attention</b>
      <span class="ab-badges">
        ${crit ? `<span class="ab-b crit">${crit} critical</span>` : ''}
        ${warn ? `<span class="ab-b warn">${warn} warning</span>` : ''}

        <span class="ab-txt"><b>${a.title}</b> <span class="ab-detail">${a.detail || ''}</span></span>

}

// ── 動態引導：讀現在的異常，丟一句「具體可點」的問題（解「想不出要問什麼」）──
function suggestFromAnomalies() {
  fetch('/anomalies').then(r => r.json()).then(d => {
    const alerts = (d.alerts || []).filter(a => a.level !== 'info');
    if (!alerts.length) return;
    // 挑最嚴重的一筆，組一句「使用者可以這樣問」的具體引導
    const a = alerts[0];
    let q = '', hint = '';
    if (a.type === 'po_short') {
      q = `why is ${a.data.name} down so much`;
      hint = `I found a mismatch on "${a.data.name}" - shall I trace the cause?`;
    } else if (a.type === 'low_stock') {
      q = `whats the safety stock for ${a.data.name}`;
      hint = `"${a.data.name}" is running out (${a.data.days_left} days left) - view settings?`;
    } else if (a.type === 'expiry') {
      q = 'whats expiring soon';
      hint = `Some items are expiring soon - see the full list?`;
    } else {
      q = 'give me a full warehouse report';
      hint = 'I spotted some anomalies - shall I produce a full warehouse report?';
    }
    // ⚠️ 要設 currentBotMsg——showSuggestions 開頭是 `if (!currentBotMsg) return;`，
    //   原本只把 appendBot 的結果存進區域變數 cb，導致這兩顆鉤子按鈕
    //   **從來沒顯示過**（靜默失效，不會報錯）。
    currentBotMsg = appendBot('💡 ' + hint);
    showSuggestions([
      { label: '👉 ' + q, query: q },
      { label: '📄 Full warehouse report', query: 'give me a full warehouse report' },
    ]);
    currentBotMsg = null;
  }).catch(() => {});
}

// ── 任務拆解進度樹 ──────────────────────────────────────────
let _taskPlanEl = null;

function renderTaskPlan(steps) {
  _taskPlanEl = document.createElement('div');
  _taskPlanEl.className = 'task-plan';
  _taskPlanEl.style.cssText =
    'margin:6px 0 4px 12px;padding:8px 12px;border-left:3px solid var(--accent);' +
    'background:rgba(var(--accent-rgb,99,179,237),.06);border-radius:0 8px 8px 0;' +
    'font-size:12px;display:flex;flex-direction:column;gap:5px;animation:traceIn .2s ease';
  const title = document.createElement('div');
  title.style.cssText = 'font-weight:700;color:var(--accent);margin-bottom:2px;font-size:11px;letter-spacing:.05em';
  title.textContent = '▸ Task plan';
  _taskPlanEl.appendChild(title);
  steps.forEach((s, i) => {
    const row = document.createElement('div');
    row.id = `task-step-${i}`;
    row.style.cssText = 'display:flex;align-items:center;gap:7px;color:var(--muted)';
    row.innerHTML = `<span class="task-chk" style="font-size:13px">⬜</span><span>${s}</span>`;
    _taskPlanEl.appendChild(row);
  });
  if (currentBotMsg) {
    currentBotMsg.parentNode.insertBefore(_taskPlanEl, currentBotMsg.nextSibling);
  } else {
    $('chat').appendChild(_taskPlanEl);
  }
  scrollBottom();
}

function tickTaskStep(index) {
  if (!_taskPlanEl) return;
  const row = _taskPlanEl.querySelector(`#task-step-${index}`);
  if (!row) return;
  const chk = row.querySelector('.task-chk');
  if (chk) chk.textContent = '✅';
  row.style.color = 'var(--fg)';
  row.style.fontWeight = '500';
}

const TRACE_KIND = {
  glob:    { icon: '📂', label: 'Scan directory', color: '#7c9cbf' },
  grep:    { icon: '🔍', label: 'Match keyword', color: '#7c9cbf' },
  read:    { icon: '📄', label: 'Read file', color: '#7c9cbf' },
  reason:  { icon: '🧠', label: 'Analyse', color: '#a08c5a' },
  act:     { icon: '⚙️', label: 'Execute', color: '#5a8c6a' },
  confirm: { icon: '✅', label: 'Confirm', color: '#5a8c6a' },
  verify:  { icon: '🔎', label: 'Verify', color: '#7c9cbf' },
};

let _traceContainer = null;  // trace container of the current bubble
let _pendingToolCalls = [];  // buffered tool_call messages, inserted once the card exists
let _rcaCardId = null;       // id of this turn's agent_rca card, used by the round2 handler

function appendTraceStep(step) {
  // 若還沒有 trace 容器，建一個接在目前 bot 訊息後面
  if (!_traceContainer) {
    _traceContainer = document.createElement('div');
    _traceContainer.className = 'agent-trace-live';
    _traceContainer.style.cssText =
      'margin:4px 0 4px 12px;padding:6px 10px;border-left:2px solid var(--border);' +
      'font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;';
    if (currentBotMsg) {
      currentBotMsg.parentNode.insertBefore(_traceContainer, currentBotMsg.nextSibling);
    } else {
      $('chat').appendChild(_traceContainer);
    }
  }
  const k = TRACE_KIND[step.kind] || { icon: '▸', label: step.kind, color: '#888' };
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;align-items:flex-start;gap:6px;animation:traceIn .2s ease';
  row.innerHTML =
    `<span style="min-width:18px">${k.icon}</span>` +
    `<span style="color:${k.color};font-weight:600;min-width:72px">${k.label}</span>` +
    `<span style="color:var(--text-secondary)">${step.detail}</span>`;
  _traceContainer.appendChild(row);
  scrollBottom();
}

function handleMessage(msg) {
  if (msg.type === 'anomaly_alert') {
    pullAnomalies();
    return;
  }
  if (msg.type === 'alert_triggered') {
    // 背景排程掃到警示觸發 → 推一張通知 card
    const banner = document.createElement('div');
    banner.className = 'alert-triggered-banner';
    banner.innerHTML = `🔔 <b>Alert triggered</b> (${msg.rule_id}) ${msg.ts || ''}<br>
      <span style="color:var(--muted)">${msg.scope_txt}: ${msg.condition_label}</span><br>
      ${msg.detail || ''}`;
    messages.appendChild(banner);
    scrollBottom();
    // 更新 badge
    const badge = $('alert-badge');
    const cur = parseInt(badge.textContent) || 0;
    badge.textContent = cur;
    badge.style.display = 'block';
    badge.style.background = '#e53e3e';
    if (_alertPanelOpen) loadAlertPanel();
    return;
  }
  if (msg.type === 'snapshot') {
    applySnapshot(msg.snapshot);
    return;
  }
  if (msg.type === 'live_batch') {
    // 只更新網格，**不往對話區塞異動列**（user 定調 2026-08-03）：
    // 例行進出貨洗版會稀釋真正該被看到的東西——對話區只留
    // 缺貨警示 / 排程觸發 / 訪客自己的問答。想看細節就展開商品清單。
    if (msg.grid) renderGrid(msg.grid);
    pullAnomaliesThrottled();      // 缺貨警示橫幅跟著動
    return;
  }
  if (msg.type === 'alert_checked_ok') {
    // 規則已檢查、目前不符合條件。展場關鍵：讓訪客分得出
    // 「系統沒反應」vs「這商品剛好沒缺貨」——後者才是實情。
    const banner = document.createElement('div');
    banner.className = 'alert-ok-banner';
    banner.innerHTML = `✅ <b>Alert rule active</b> (${msg.rule_id}) ${msg.ts || ''}<br>
      <span style="color:var(--muted)">Checked just now: ${msg.scope_txt} — ${msg.condition_label} not met yet, nothing to report.</span>`;
    messages.appendChild(banner);
    scrollBottom();
    return;
  }
  if (msg.type === 'alert_deleted') {
    if (_alertPanelOpen) loadAlertPanel();
    return;
  }
  if (msg.type === 'schedule_triggered') {
    const banner = document.createElement('div');
    banner.className = 'schedule-triggered-banner';
    banner.innerHTML = `⏰ <b>Schedule ran</b> (${msg.job_id}) ${msg.ts || ''}<br>
      <span style="color:var(--muted)">Running: ${msg.script_label}</span>`;
    messages.appendChild(banner);
    scrollBottom();
    return;
  }
  if (msg.type === 'schedule_done') {
    const banner = document.createElement('div');
    banner.className = 'schedule-triggered-banner';
    const icon = msg.ok ? '✅' : '❌';
    banner.innerHTML = `${icon} <b>${msg.script_label}</b> ${msg.ok ? 'succeeded' : 'failed'}<br>
      <span style="color:var(--muted)">${msg.output_tail || msg.summary || ''}</span>`;
    messages.appendChild(banner);
    scrollBottom();
    if (_alertPanelOpen && _currentPanelTab === 'schedules') loadSchedulePanel();
    return;
  }
  if (msg.type === 'schedule_created' || msg.type === 'schedule_deleted') {
    if (_alertPanelOpen && _currentPanelTab === 'schedules') loadSchedulePanel();
    return;
  }
  if (msg.type === 'task_plan') {
    renderTaskPlan(msg.steps);
    return;
  }
  if (msg.type === 'task_tick') {
    tickTaskStep(msg.index);
    return;
  }
  if (msg.type === 'trace_step') {
    if (_rcaCardId) {
      const existCard = document.getElementById(_rcaCardId);
      if (existCard) {
        const row = document.createElement('div');
        row.style.cssText = 'margin:4px 0;padding:5px 8px;background:rgba(160,140,90,.12);border-radius:4px;font-size:12px;color:var(--text-secondary)';
        row.textContent = '[analysis] ' + (msg.step.detail || '');
        // 插到 suggest 之前（tool_calls 之後）
        const suggestEl = existCard.querySelector('[id^=\"rca-suggest-\"]');
        if (suggestEl && suggestEl.parentNode) {
          suggestEl.parentNode.insertBefore(row, suggestEl);
        } else {
          existCard.appendChild(row);
        }
        return;
      }
    }
    appendTraceStep(msg.step);
    return;
  }
  if (msg.type === 'perf') {
    updatePerfBadge(msg);
    return;
  }
  // 錯字/同音已被後端修好 → 把剛送出的使用者氣泡換成修復後的文字。
  //   若畫面留著原始錯字，訪客會以為系統沒聽懂；顯示修好的版本，
  //   「錯字容錯」才看得出來真的在運作（展場賣點）。
  if (msg.type === 'user_fixed') {
    const all = messages.querySelectorAll('.msg.user');
    const last = all[all.length - 1];
    if (last && msg.text) last.textContent = msg.text;
    return;
  }
  if (msg.type === 'token') {
    if (!currentBotMsg) currentBotMsg = appendBot('');
    currentBotMsg.textContent += msg.text;
    scrollBottom();
    return;
  }
  if (msg.type === 'error') {
    if (currentBotMsg) currentBotMsg.remove();
    appendBot(msg.text, 'rejected');
    currentBotMsg = null;
    setSending(false);
    return;
  }
  if (msg.type === 'tool_call') {
    const tcHtml = `🔧 <code>${msg.func}(${msg.args_preview || ''})</code>`;
    // 第二輪（_rcaCardId 已存在）→ 插到 rca-suggest 前
    if (_rcaCardId) {
      const existCard = document.getElementById(_rcaCardId);
      if (existCard) {
        const suggestEl = existCard.querySelector('[id^="rca-suggest-"]');
        const tc = document.createElement('div');
        tc.className = 'tool-call-inline';
        tc.innerHTML = tcHtml;
        if (suggestEl) suggestEl.before(tc);
        else existCard.appendChild(tc);
        return;
      }
    }
    // 第一輪：card 還沒建，暫存
    _pendingToolCalls.push(tcHtml);
    return;
  }
  if (msg.type === 'rca_round2_start') {
    // 第二輪 LLM 開始：在 rca-suggest 區塊顯示 loading 動畫
    const _rcaCard2 = _rcaCardId ? document.getElementById(_rcaCardId) : null;
    const suggestEl = _rcaCard2 ? _rcaCard2.querySelector('[id^="rca-suggest-"]') : null;
    if (suggestEl) {
      suggestEl.innerHTML = '<span style="color:var(--muted);font-size:13px">💡 Agent suggested action </span><span class="loading-dots"><span></span><span></span><span></span></span>';
      suggestEl.style.display = '';
    }
    return;
  }
  if (msg.type === 'rca_round2_done') {
    const _rcaCard3 = _rcaCardId ? document.getElementById(_rcaCardId) : null;
    const suggestEl = _rcaCard3 ? _rcaCard3.querySelector('[id^="rca-suggest-"]') : null;
    if (suggestEl && msg.suggestion) {
      const actionColor = {
        contact_supplier: '#e67e22',
        create_po:        'var(--danger)',
        monitor:          'var(--accent)',
      }[msg.suggestion_action] || 'var(--accent)';
      suggestEl.innerHTML = `<span style="font-weight:600;color:${actionColor}">💡 Agent suggestion</span><br>${msg.suggestion.replace(/</g,'&lt;')}`;
    } else if (suggestEl) {
      suggestEl.style.display = 'none';
    }
    _rcaCardId = null;
    setSending(false);
    return;
  }
  if (msg.type === 'done') {
    const result = msg.result || {};
    const view = result.view;
    const data = result.data || {};
    // HITL Confirm送出後，doConfirm() 把按鈕列換成「Running…」，但原本的Confirm卡沒有
    // 隨著新結果卡一起被清掉，導致「Running…」永久卡著（2026-07-02 實測抓到）。
    // done 必然緊接在Confirm動作之後送達，此時清掉所有殘留的Running提示是安全的。
    document.querySelectorAll('.hitl-btns').forEach(el => {
      if (el.textContent.includes('Running')) el.remove();
    });
    // 若 loading-dots 還在（例如Cancel直接跳 done，沒有 token），清空文字但保留節點，
    // 讓 renderViewCard 仍有掛載點可插入卡片（先前整個 remove()+null 會導致卡片沒渲染出來）
    if (currentBotMsg && currentBotMsg.querySelector('.loading-dots')) {
      currentBotMsg.innerHTML = '';
    }
    lastBotAnchor = currentBotMsg;   // defaults to after the bubble; renderViewCard switches it to the card when present
    try {
      // 渲染例外絕不能讓 done 流程中斷（2026-08-05 實案：compare 排名卡
      // 炸 toLocaleString → setSending 沒跑到 → 整頁輸入卡死到重整）
      if (view && view !== 'guide' && view !== 'rejected') {
        renderViewCard(view, data, result.summary);
      }
      renderFollowups(view, data);
    } catch (e) {
      console.error('[render] view card failed:', e);
    }
    // 空摘要泡泡不留白條（2026-08-05 網頁百句實測：摘要為空的回答會留一顆
    // 空白長泡泡掛在卡片上方，整場累積一大排，user 一眼抓包）
    if (currentBotMsg && !currentBotMsg.innerText.trim()) {
      currentBotMsg.remove();
    }
    currentBotMsg = null;
    if (_traceContainer && _traceContainer.parentNode) { _traceContainer.parentNode.removeChild(_traceContainer); }
    _traceContainer = null;
    _pendingToolCalls = [];
    _taskPlanEl = null;
    // 存下 card id 給 round2 handler 用（但不鎖按鈕，訪客可繼續問）
    if (view === 'agent_rca' && lastBotAnchor && lastBotAnchor.id) {
      _rcaCardId = lastBotAnchor.id;
    }
    setSending(false);
    return;
  }
}

function renderViewCard(view, data, topSummary) {
  if (!currentBotMsg) return;
  const card = document.createElement('div');
  card.className = 'view-card';
  card.id = 'vc-' + Date.now();
  if (view === 'inventory_single') {
    const per = data.per_warehouse || {};
    const maxQty = Math.max(...Object.values(per), 1);
    const isLow = data.is_low_stock;
    const nx = data.next_expiring;
    const expBadge = (nx && ['red','orange','yellow'].includes(nx.level))
      ? `<span class="exp-badge ${nx.level}" style="margin-left:6px">${nx.level_emoji} ${nx.warehouse_label} ${nx.qty} units · ${nx.days_to_expire} days to expiry</span>`
      : '';
    // r9：單品「還能撐幾天」——原本 days_left 只有缺貨清單卡有。
    //   ⚠️ 999 是後端「完全沒消耗」的哨兵值，不是「撐很久」（r7 踩過反向誤判）
    //   ⚠️ null = 單倉查詢（全倉消耗掛在單倉數字上會誤導）→ 不顯示
    const dl = data.days_left;
    const coverBadge = (dl == null) ? ''
      : (dl >= 999
          ? `<span class="cover-badge">📅 no recent outbound</span>`
          : `<span class="cover-badge${dl <= 7 ? ' critical' : (dl <= 14 ? ' warn' : '')}">📅 ~${dl} days of cover${data.daily_burn ? ` · ${data.daily_burn}/day` : ''}</span>`);
    card.innerHTML = `
      <div class="label">${data.name} (${data.category_label})</div>
      <div class="kpi ${isLow ? 'warning' : ''}">${data.total_qty.toLocaleString()} units</div>
      <div class="sub-label">Total value NT$ ${data.value.toLocaleString()} ${isLow ? ' · ⚠️ below safety stock' : ''} ${expBadge} ${coverBadge}</div>
      <div class="wh-bars">
        ${Object.entries(per).map(([k, v]) => `
          <div class="wh-bar">
            <div class="wh-name">${WAREHOUSE_LABEL[k] || k}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${(v/maxQty*100).toFixed(0)}%"></div></div>
            <div class="wh-qty">${v.toLocaleString()}</div>
          </div>
        `).join('')}
      </div>
    `;
  } else if (view === 'alert_list') {
    // r54 視圖覆蓋審計補：警示規則列表曾只有「目前有 N 條」一句話、明細沒卡可看
    const alRules = data.rules || [];
    card.innerHTML = alRules.length === 0
      ? `<div style="text-align:center;color:var(--muted)">No alert rules</div>`
      : `<div class="label">🔔 Alert rules (${alRules.length})</div>
         <table class="exp-table"><tr><th>ID</th><th>Condition</th><th>Scope</th><th>Status</th></tr>
         ${alRules.map(r => `<tr><td>${r.id}</td><td>${r.condition_label || r.condition}</td>
           <td style="font-size:12px">${(r.scope_names || []).join(', ') || 'all items'}</td>
           <td>${r.enabled ? '✅' : '⏸'}</td></tr>`).join('')}
         </table>
         <div class="rel-baseline-note">To remove, say "delete ${alRules[0]?.id || 'AL001'}"</div>`;
  } else if (view === 'schedule_list') {
    const scJobs = data.jobs || [];
    card.innerHTML = scJobs.length === 0
      ? `<div style="text-align:center;color:var(--muted)">No schedules</div>`
      : `<div class="label">⏰ Schedules (${scJobs.length})</div>
         <table class="exp-table"><tr><th>ID</th><th>Details</th><th>Frequency</th><th>Status</th></tr>
         ${scJobs.map(j => `<tr><td>${j.id}</td><td>${j.script_label || j.script_id}</td>
           <td>${j.freq_label || j.freq} ${j.time_str || ''}</td>
           <td>${j.enabled ? '✅' : '⏸'}</td></tr>`).join('')}
         </table>
         <div class="rel-baseline-note">To cancel, say "delete ${scJobs[0]?.id || 'SCH001'}"</div>`;
  } else if (view === 'inventory') {
    // r54 修復（user 實測抓到）：「有哪些商品/類別庫存」的概覽清單 server 回
    // view=inventory + rows，前端一直沒有這個 view 的渲染器 → 只顯示一句
    // 「以下為前 10 筆」但表格從沒畫出來。複用 exp-table 樣式列出。
    const invRows = data.rows || [];
    const invCapt = data.category_label ? `${data.category_label}`
                   : (data.warehouse_label && data.warehouse_label !== 'All warehouses' ? data.warehouse_label : 'all items');
    const invTotal = data.total_items ?? invRows.length;
    card.innerHTML = `
      <div class="label">📦 ${invCapt} stock list (${invTotal} items${invRows.length < invTotal ? `, showing first ${invRows.length}` : ''})</div>
      <table class="exp-table">
        <tr><th>Item</th><th>Category</th><th>Stock</th></tr>
        ${invRows.map(r => `
          <tr>
            <td>${r.name}</td>
            <td style="font-size:12px;color:var(--muted)">${r.category || ''}</td>
            <td><b>${(r.qty ?? 0).toLocaleString()}</b> ${r.unit || 'units'}</td>
          </tr>
        `).join('')}
      </table>`;
  } else if (view === 'inventory_multi') {
    const matches = data.matches || [];
    card.innerHTML = `
      <div class="label">Found ${data.total_matches} matching items</div>
      <div class="rank-list">
        ${matches.map((m, i) => `
          <div class="rank-row">
            <div class="num">${i+1}</div>
            <div class="name">${m.name}<div style="font-size:11px;color:var(--muted)">${m.category_label}</div></div>
            <div class="qty">${m.total_qty.toLocaleString()}</div>
          </div>
        `).join('')}
      </div>
    `;
  } else if (view === 'low_stock') {
    const warns = data.warnings || [];
    if (warns.length === 0) {
      card.innerHTML = `<div style="text-align:center;font-size:30px">✅</div><div style="text-align:center;color:var(--success);margin-top:6px">All items are well stocked</div>`;
    } else {
      card.innerHTML = `
        <div class="label">Low stock alerts (${warns.length}) — sorted by days left</div>
        <table class="alert-table">
          <tr><th>Item</th><th>WH</th><th>On hand</th><th>Days left</th><th>Suggest</th></tr>
          ${warns.slice(0, 50).map(w => {
            const days = w.days_left;
            const daysCls = days <= 3 ? 'critical' : '';
            // ⚠️ 999 是後端「**完全沒消耗**」的哨兵值（_wh_burn_days_left
            //   在 burn<=0 時回 (999, 0)），不是「天數很大」。
            //   原本寫 `days >= 999` 把真實計算值也吃掉了——實測
            //   Heavy-duty Trash Bags：157 件 ÷ 0.1/天 = **1570 天**是真值，
            //   卻顯示成「-」（訪客看到「撐天數不明」，實際是「撐超久」，語意相反）。
            //   ⇒ 改用 daily_burn === 0 判斷「沒消耗」，天數大就照常顯示 60+。
            const noBurn = (w.daily_burn === 0 || w.daily_burn == null);
            const daysTxt = noBurn ? '-' : (days >= 60 ? '60+' : (days + 'd'));

    //   （'No item matching "x"'）。r8 抓到②也照畫選單 → 訪客看到一顆孤零零的
    //   Cancel 鈕 + 「type 1-0」（0 個選項卻叫人輸入 1-0）。無選項時只出文字。
    card.innerHTML = opts.length === 0
      ? `<div class="label" style="margin-bottom:2px">❓ ${esc(data.question)}</div>`
      : `
      <div class="label" style="margin-bottom:8px">❓ ${esc(data.question)}</div>
      <div class="clarify-opts">
        ${opts.map((opt, i) => {
          const c = _cands[i];
          const sub = c ? `<span class="clarify-sub">${esc(c.category||'')} · total ${c.qty} ${esc(c.unit||'units')}</span>` : '';
          return `<button class="clarify-row" data-copt="${i}"><span class="clarify-num">${i+1}</span><span class="clarify-text">${esc(opt)}${sub}</span></button>`;
        }).join('')}
        <button class="clarify-row clarify-cancel" data-copt="cancel"><span class="clarify-num">✕</span><span class="clarify-text">Cancel</span></button>
      </div>
      <div class="clarify-hint">Tap an option, type 1-${opts.length}, or type your full question</div>
    `;
    // 把選項存到 window，讓送出時能展開數字
    //   ⚠️ 無選項的 clarify（誠實拒絕）要存 null 不是 []——留著空陣列會讓
    //     下一句的數字解析誤以為「還有選單在等你選」
    window._clarifyOpts = opts.length ? opts : null;
    // actions：實際送出的指令（沒有就 fallback 用 opts）
    window._clarifyActions = opts.length ? (data.actions || opts) : null;
    // 點選項 = 跟打數字走同一條路（解析成實際指令 → sendQuery）
    card.querySelectorAll('.clarify-row').forEach(btn => {
      btn.onclick = () => {
        // Cancel鈕：訪客隨口問問、不想選了 → 直接關掉卡片，不送任何查詢（展場友善）
        if (btn.dataset.copt === 'cancel') {
          window._clarifyOpts = null;
          window._clarifyActions = null;
          document.querySelectorAll('.view-card').forEach(el => {
            if (el.querySelector('.clarify-opts')) el.remove();
          });
          return;
        }
        const idx = parseInt(btn.dataset.copt);
        const actions = window._clarifyActions || window._clarifyOpts;
        if (!actions || idx < 0 || idx >= actions.length) return;
        const resolved = actions[idx] || (window._clarifyOpts || [])[idx];
        window._clarifyOpts = null;
        window._clarifyActions = null;
        document.querySelectorAll('.view-card').forEach(el => {
          if (el.querySelector('.clarify-opts')) el.remove();
        });
        sendQuery(resolved);
      };
    });
  } else {
    return;
  }
  // 把暫存的 tool call 插到 card 標題下方
  if (_pendingToolCalls.length) {
    const label = card.querySelector('.label, .agent-label');
    const tcWrap = document.createElement('div');
    tcWrap.className = 'tool-calls-bar';
    tcWrap.innerHTML = _pendingToolCalls.join(' ');
    if (label) label.after(tcWrap); else card.prepend(tcWrap);
    _pendingToolCalls = [];
  }
  currentBotMsg.parentNode.insertBefore(card, currentBotMsg.nextSibling);
  lastBotAnchor = card;
  scrollBottom();
}

// ── HITL Confirm：把 pending 送回 server commit ──
function doConfirm(btn) {
  const action = btn.dataset.action;
  const payload = JSON.parse(btn.dataset.payload || '{}');
  const btnsEl = btn.closest('.hitl-btns');
  const origHtml = btnsEl ? btnsEl.innerHTML : '';
  if (btnsEl) btnsEl.innerHTML = '<div style="padding:10px;color:var(--muted)">Running…</div>';
  const msg = JSON.stringify({type:'confirm', action, ...payload});
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(msg);
    return;
  }
  // 斷線：重連後「等到真的 OPEN」才送，等不到就還原按鈕讓使用者重按
  // （原本固定 1200ms 硬送，重連沒done ws.send 會 throw，Confirm永久丟失、UI 卡「Running…」）
  connectWS();
  let tries = 0;
  const timer = setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      clearInterval(timer);
      ws.send(msg);
    } else if (++tries >= 20) {   // wait at most 20 x 300ms = 6s
      clearInterval(timer);
      if (btnsEl) btnsEl.innerHTML = origHtml;   // restore buttons so they can be pressed again
      appendBot('⚠️ Connection lost — your confirmation was not sent - please tap Confirm again.');
      currentBotMsg = null;
    }
  }, 300);
}

function formatMetric(metric, val) {
  if (val === undefined || val === null) return '—';
  if (metric === 'stock_value') return `NT$ ${val.toLocaleString()}`;
  if (metric === 'item_count')  return `${val.toLocaleString()} units`;
  if (metric === 'turnover')    return val.toFixed(3);
  return String(val);
}

function sendQuery(text) {
  if (isSending || !text) return;
  window._lastSentText = text;  // escape chip: was the answered item mentioned in THIS sentence?
  $('input-text').value = '';  // clear only after passing the guard, so text is never lost without being sent
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    connectWS();
    setTimeout(() => sendQuery(text), 300);
    return;
  }
  setSending(true);
  appendUser(text);
  // 處理中動畫放在對話裡（bot 氣泡的 loading dots），一直顯示到收到
  // 第一個 token/done 才被真回覆取代——不再靠底部 send-status（那位置讓給
  // 效能徽章）。token/done handler 會清掉 dots 再填內容。
  currentBotMsg = appendLoading();
  ws.send(JSON.stringify({ type: 'chat', text }));
}

function sendDirectCall(func, args) {
  if (isSending) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    connectWS();
    setTimeout(() => sendDirectCall(func, args), 300);
    return;
  }
  setSending(true);
  const labelMap = { list_low_stock: '🚨 Low stock', list_expiring_items: '⏰ Expiring' };
  appendUser(labelMap[func] || func);
  currentBotMsg = appendLoading();
  setTimeout(() => { if (currentBotMsg) currentBotMsg.innerHTML = ''; }, 50);
  ws.send(JSON.stringify({ type: 'direct_call', function: func, args }));
}

function resolveInput(raw) {
  // 如果有 clarify 選項待機，且輸入是純數字 → 展開成 action（實際指令）
  if (window._clarifyOpts && /^[1-4]$/.test(raw)) {
    const idx = parseInt(raw) - 1;
    if (idx >= 0 && idx < window._clarifyOpts.length) {
      // 優先用 actions（對應實際工具指令），沒有才用顯示文字
      const actions = window._clarifyActions || window._clarifyOpts;
      const resolved = actions[idx] || window._clarifyOpts[idx];
      window._clarifyOpts = null;
      window._clarifyActions = null;
      document.querySelectorAll('.view-card').forEach(el => {
        if (el.querySelector('.clarify-opts')) el.remove();
      });
      return resolved;
    }
  }
  window._clarifyOpts = null;
  window._clarifyActions = null;
  return raw;
}

// ─── 語音輸入（本地 whisper tiny.en 優先，Web Speech API en-US 回退）───
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = $('mic-btn');
const micStatus = $('mic-status');
let recognition = null;
let isRecording = false;

// ── 本地 ASR（Fun-ASR-Nano on RPI5）──────────────────────────────
//   展場沒網路 → 瀏覽器 Web Speech API 會 network error 直接死，所以優先走
//   本地辨識；本地不可用（缺 binary/模型/ffmpeg）才回退瀏覽器內建。
//   互動維持 Siri 式：點一下 → 講 → 靜音自動結束 → 自動送出。
let localASR = false;          // backend reports local ASR availability
let mediaRec = null;           // MediaRecorder
let audioChunks = [];
let silenceTimer = null;       // VAD: auto-stop on silence
let audioCtx = null, analyser = null, vadRAF = null;

fetch('/api/voice_status').then(r => r.json()).then(s => {
  localASR = !!s.ok;
  if (!localASR && s.reason) console.info('[voice] local ASR unavailable: ' + s.reason + ' (falling back to browser recognition)');
}).catch(() => {});

function stopVAD() {
  if (vadRAF) { cancelAnimationFrame(vadRAF); vadRAF = null; }
  if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
  if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
  analyser = null;
}

// 靜音偵測：講完自動收尾（Siri 式的靈魂——訪客不用再點第二下）
function startVAD(stream) {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    const buf = new Uint8Array(analyser.frequencyBinCount);
    let spoke = false;              // require speech before silence-stop kicks in (avoids cutting off before you start)
    // ⚠️ MAXLEN 12s 不是隨便取的：後端 whisper 用 -ac 640，容量 =
    //   640 × 30/1500 = **12.8 秒**，超過會**靜默截斷**（不報錯、安靜丟掉
    //   後面的話）。留 0.8 秒餘裕。改 ac 的話這裡要一起改。
    const SILENCE = 0.015, HANG = 1200, MAXLEN = 12000;

    const t_start = Date.now();
    const tick = () => {
      if (!analyser) return;
      analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / buf.length);

      if (rms > SILENCE) {
        spoke = true;
        if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
      } else if (spoke && !silenceTimer) {
        silenceTimer = setTimeout(() => { if (isRecording) stopLocalRec(); }, HANG);
      }
      // 硬上限：展場吵雜 VAD 可能永遠不收尾 → 15s 強制停
      if (Date.now() - t_start > MAXLEN) { if (isRecording) stopLocalRec(); return; }
      vadRAF = requestAnimationFrame(tick);
    };
    tick();
  } catch (e) { /* VAD failure does not affect recording, you just tap again manually */ }
}

function stopLocalRec() {
  stopVAD();
  if (mediaRec && mediaRec.state !== 'inactive') mediaRec.stop();
}

async function startLocalRec() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    micStatus.textContent = '❌ Microphone permission denied - please enable it in browser settings';
    return;
  }
  audioChunks = [];
  try {
    mediaRec = new MediaRecorder(stream);
  } catch (e) {
    micStatus.textContent = '❌ This browser does not support recording';
    stream.getTracks().forEach(t => t.stop());
    return;
  }

  mediaRec.ondataavailable = ev => { if (ev.data.size > 0) audioChunks.push(ev.data); };
  mediaRec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    isRecording = false;
    micBtn.classList.remove('recording');
    const blob = new Blob(audioChunks, { type: 'audio/webm' });
    if (blob.size < 2000) { micStatus.textContent = "⚠️ Didn't catch that - please try again"; return; }

    micStatus.textContent = '🧠 Recognizing…';
    try {
      const r = await fetch('/api/asr', { method: 'POST', body: blob });
      const j = await r.json();
      if (j.ok && j.text) {
        micStatus.textContent = '✓ ' + j.text;
        sendQuery(j.text);
        setTimeout(() => { micStatus.textContent = ''; }, 1500);
      } else {
        micStatus.textContent = '⚠️ ' + (j.reason || 'nothing recognized') + ' - please try again';
      }
    } catch (e) {
      micStatus.textContent = '⚠️ Recognition failed, please try again';
    }
  };

  mediaRec.start();
  isRecording = true;
  micBtn.classList.add('recording');
  micStatus.textContent = '🎤 Listening… will send automatically when you stop';
  startVAD(stream);
}

if (!SpeechRec) {
  // 沒有瀏覽器辨識也沒關係——本地 ASR 才是主力，只有兩者皆無才停用
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    micBtn.disabled = true;
    micBtn.title = 'This browser does not support voice input (use Chrome / Edge / Safari)';
  } else {
    micBtn.addEventListener('click', () => {
      if (isRecording) stopLocalRec(); else startLocalRec();
    });
  }
} else {
  recognition = new SpeechRec();
  // EN build：回退路徑也要講英文——本地 ASR 掛掉時才走這裡，而那正是最
  //   需要它能用的時候。設成 zh-TW 等於「回退方案本身也是壞的」。
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isRecording = true;
    micBtn.classList.add('recording');
    micStatus.textContent = '🎤 Listening... please speak';
  };
  recognition.onresult = ev => {
    let txt = '';
    for (let i = 0; i < ev.results.length; i++) {
      txt += ev.results[i][0].transcript;
    }
    $('input-text').value = txt;
  };
  recognition.onerror = ev => {
    isRecording = false;
    micBtn.classList.remove('recording');
    if (ev.error === 'not-allowed' || ev.error === 'permission-denied') {
      micStatus.textContent = '❌ Microphone permission denied - please enable it in browser settings';
    } else if (ev.error === 'no-speech') {
      micStatus.textContent = "⚠️ Didn't catch that - please try again";
    } else if (ev.error === 'network') {
      micStatus.textContent = '⚠️ Speech recognition needs a network connection (iOS Safari works offline)';
    } else {
      micStatus.textContent = `Voice error: ${ev.error}`;
    }
  };
  recognition.onend = () => {
    isRecording = false;
    micBtn.classList.remove('recording');
    const text = $('input-text').value.trim();
    if (text) {
      micStatus.textContent = '✓ Recognized, sending...';
      setTimeout(() => {
        $('input-text').value = '';
        sendQuery(text);
        micStatus.textContent = '';
      }, 200);
    } else {
      micStatus.textContent = '';
    }
  };

  micBtn.addEventListener('click', () => {
    // 本地 ASR 優先（展場離線可用）；不可用才走瀏覽器內建（需連 Google）
    if (localASR) {
      if (isRecording) stopLocalRec(); else startLocalRec();
      return;
    }
    if (isRecording) {
      recognition.stop();
    } else {
      $('input-text').value = '';
      micStatus.textContent = '';
      try {
        recognition.start();
      } catch (e) {
        micStatus.textContent = 'Voice start failed: ' + e.message;
      }
    }
  });
}

function refreshSnapshot() {
  fetch('/snapshot').then(r => r.json()).then(s => {
    applySnapshot(s);
  });
}

// ─── 即時看板：數字變動時閃一下（Live 模式的視覺主體）───
// 先前 snapshot 推播進來只更新標題那行文字，數字根本不會動＝白推。
const _lbPrev = {};
function _lbSet(id, val, fmt) {
  const el = document.getElementById(id);
  if (!el) return;
  const prev = _lbPrev[id];
  el.textContent = fmt ? fmt(val) : val;
  if (prev !== undefined && prev !== val) {
    const cls = val > prev ? 'up' : 'down';
    el.classList.remove('up', 'down');
    void el.offsetWidth;              // 強制 reflow，讓同方向連續變動也會重播動畫
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), 900);
  }
  _lbPrev[id] = val;
}

function applySnapshot(s) {
  if (!s) return;
  $('snap-date').textContent = `${s.snapshot_date} · ${s.sku_count} SKU · ${s.warehouse_count} `;
  const n = x => x.toLocaleString();
  (s.warehouse_summary || []).forEach(w => {
    _lbSet('lb-' + w.warehouse, w.item_count, n);
  });
  if (typeof s.low_stock_count === 'number') _lbSet('lb-low', s.low_stock_count, n);
}

// ─── 60 商品即時網格 ───────────────────────────────────────
// user 要的是「每個商品的數量各自跳動、而且同時看得到」。
// 看板列只有三倉合計＝看不出單一商品在動；這裡一格一個商品。
let _gridOpen = false;
const _gridPrev = {};

const _WH = ['north', 'central', 'south'];
const _WH_LABEL = {north: 'North', central: 'Central', south: 'South'};

function _bump(el, val, prevKey) {
  // 數字更新 + 變動時閃色（上綠下紅）。回傳新值供記錄。
  if (!el) return val;
  const prev = _gridPrev[prevKey];
  el.textContent = val.toLocaleString();
  if (prev !== undefined && prev !== val) {
    const cls = val > prev ? 'up' : 'down';
    el.classList.remove('up', 'down');
    void el.offsetWidth;                      // 強制 reflow 才會重播動畫
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), 900);
  }
  _gridPrev[prevKey] = val;
  return val;
}

function renderGrid(rows) {
  const host = document.getElementById('live-grid');
  if (!host || !rows) return;

  if (!host.dataset.built) {
    // 一列一商品：品名 + 北/中/南各自的量 + 合計
    host.innerHTML =
      `<div class="lg-head">
         <span>Item</span>
         ${_WH.map(w => `<span style="text-align:right">${_WH_LABEL[w]}</span>`).join('')}
         <span style="text-align:right">Total</span>
       </div>` +
      rows.map(r =>
        `<div class="lg-row" id="lg-${r.sku}" title="${r.name}">
           <span class="lg-name">${r.name}</span>
           ${_WH.map(w =>
             `<span class="lg-q" id="lgq-${r.sku}-${w}">${(r.per[w] || 0).toLocaleString()}</span>`
           ).join('')}
           <span class="lg-tot" id="lgt-${r.sku}">${r.total.toLocaleString()}</span>
         </div>`).join('');
    host.dataset.built = '1';
    rows.forEach(r => {
      _WH.forEach(w => { _gridPrev[r.sku + '-' + w] = r.per[w] || 0; });
      _gridPrev[r.sku] = r.total;
    });
    return;
  }

  rows.forEach(r => {
    // 每個倉別各自跳動、各自判斷是否低於安全庫存
    _WH.forEach(w => {
      const el = document.getElementById('lgq-' + r.sku + '-' + w);
      if (!el) return;
      const v = r.per[w] || 0;
      _bump(el, v, r.sku + '-' + w);
      el.classList.toggle('low', (r.safety || 0) > 0 && v < r.safety);
    });
    const tel = document.getElementById('lgt-' + r.sku);
    if (tel) {
      tel.textContent = r.total.toLocaleString();
      _gridPrev[r.sku] = r.total;
    }
  });
}

function toggleGrid() {
  _gridOpen = !_gridOpen;
  const host = document.getElementById('live-grid');
  const btn = document.getElementById('lb-grid-btn');
  host.style.display = _gridOpen ? 'grid' : 'none';
  btn.textContent = _gridOpen ? '▴ Hide items' : '▾ Show all items';
  if (_gridOpen && !host.dataset.built) {
    fetch('/api/live_grid').then(r => r.json()).then(d => renderGrid(d.grid));
  }
}

function tuneLive() {
  const sp = parseInt(document.getElementById('lb-speed').value, 10);
  document.getElementById('lb-speed-v').textContent = sp + 'x';
  fetch('/api/live_mode', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action: 'tune', speedup: sp})
  }).catch(() => {});
}
refreshSnapshot();

// ─── 鉤子入口隨機輪播(勾起好奇、騙人點進連帶分析)───
// 每次開/重整網頁,從池子隨機選 2 顆鉤子插在 chips-bar 最前面
const HOOK_POOL = [
  { txt: '🍺 What sells with diapers?', kw: 'diapers' },
  { txt: '☕ What to stock with a coffee machine?', kw: 'coffee machine' },
  { txt: '🏕️ What else do tent buyers take?', kw: 'tent' },
  { txt: '🎧 What goes with earphones?', kw: 'bluetooth earphones' },
  { txt: '💪 What else with a yoga mat?', kw: 'yoga mat' },
  { txt: "🏃 What is in a runner's basket?", kw: 'running shoes' },
  { txt: '❄️ What pairs with a down jacket?', kw: 'down jacket' },
  { txt: '🧹 What to stock for a big clean?', kw: 'laundry detergent' },
];
(function mountHooks() {
  const bar = $('chips-bar');
  const shuffled = HOOK_POOL.slice().sort(() => Math.random() - 0.5).slice(0, 2);
  // 額外固定一顆「隨機驚喜」
  const surprise = document.createElement('button');
  surprise.className = 'chip hook purple';
  surprise.textContent = '🎲 Surprise me';
  surprise.onclick = randomSurprise;
  bar.insertBefore(surprise, bar.firstChild);
  shuffled.forEach(h => {
    const btn = document.createElement('button');
    btn.className = 'chip hook';
    btn.textContent = h.txt;
    btn.onclick = () => sendQuery(`what else do ${h.kw} buyers get`);
    bar.insertBefore(btn, bar.firstChild);
  });
})();

currentBotMsg = appendBot(
  '👋 Hi! I am the Warehouse Agent. Just type your question like you would ask a colleague.\n\n' +
  'Here is what I can do — not sure how to ask? Tap any example below to send it 👇'
);
// ── 能力地圖：明白告訴使用者「我會哪幾類事」+ 每類給可點範例 ──
renderCapabilityMap();
currentBotMsg = null;

// 進站 1.5 秒後，根據「現在的異常」丟一句具體的動態引導（解「想不出要問什麼」）
// setTimeout(suggestFromAnomalies, 1500); // 展場關閉動態提示

// ─────────────────────────────────────────────────────────────
// 效能徽章（晶片 demo 用）：右下角，預設只露一顆 ⚡ 圖示，
// 點它 or 按 P 鍵展開/收合。每次推論完 server 送 perf 訊息更新數字。
// ─────────────────────────────────────────────────────────────
(function mountPerfBadge() {
  const wrap = document.createElement('div');
  wrap.id = 'perf-badge';
  wrap.innerHTML = `
    <div id="perf-toggle" title="Performance (press P)">⚡</div>
    <div id="perf-panel">
      <div class="perf-title">⚡ FunctionGemma 270M<span class="perf-chip">In-house chip</span></div>
      <div class="perf-row"><span>Generation</span><b id="perf-tps">— tok/s</b></div>
      <div class="perf-row"><span>This inference</span><b id="perf-detail">—</b></div>
      <div class="perf-hint" id="perf-close">CPU inference · live measurement</div>
    </div>`;
  document.body.appendChild(wrap);

  const toggle = wrap.querySelector('#perf-toggle');
  function togglePanel() { wrap.classList.toggle('open'); }
  toggle.onclick = togglePanel;
  wrap.querySelector('#perf-close').onclick = togglePanel;
  document.addEventListener('keydown', e => {
    // 按 P 切換（避免在輸入框打字時誤觸）
    if ((e.key === 'p' || e.key === 'P') &&
        document.activeElement !== $('input-text')) {
      e.preventDefault(); togglePanel();
    }
  });
})();

let _perfEma = null;  // light smoothing on generation speed so the number does not jump around
function updatePerfBadge(p) {
  const tpsEl = $('perf-tps'), detEl = $('perf-detail');
  if (!tpsEl) return;
  // Generation只由真 LLM 推論更新（route 模式沒有 token，維持上次 tok/s）
  if (p.tps > 0) {
    _perfEma = _perfEma == null ? p.tps : (_perfEma * 0.6 + p.tps * 0.4);
    tpsEl.textContent = _perfEma.toFixed(1) + ' tok/s';
    tpsEl.style.color = _perfEma >= 20 ? 'var(--success)' :
                        _perfEma >= 10 ? '#d69e2e' : 'var(--accent)';
  }
  // 「本次」區分兩種路徑：LLM 推論顯示 tok/時間，intent_clf 路由顯示分類延遲
  if (p.mode === 'route') {
    detEl.textContent = `⚡ Smart routing ${p.ms}ms`;
  } else {
    detEl.textContent = `🧠 LLM ${p.tok} tok / ${(p.ms/1000).toFixed(2)}s`;
  }
}
</script>
